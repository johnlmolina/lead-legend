name: CI

# Runs on every push and PR. The unit-test and e2e jobs hit a REAL Supabase
# project (see tests/helpers/supabase-admin.ts and TESTING.md) — there's no
# meaningful way to fake RLS enforcement with mocks, so this workflow needs
# real Supabase credentials as repository secrets, not placeholders:
#
#   NEXT_PUBLIC_SUPABASE_URL
#   NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
#   SUPABASE_SERVICE_ROLE_KEY
#   DATABASE_URL
#
# Strongly recommended: point these at a dedicated Supabase project used only
# for CI, not your production project — the test suite creates and deletes
# real organizations/users on every run. Optional secrets (ANTHROPIC_API_KEY,
# TWILIO_ACCOUNT_SID/AUTH_TOKEN/PHONE_NUMBER, GOOGLE_CLIENT_ID/SECRET,
# TOKEN_ENCRYPTION_KEY) unlock the tests that are auto-skipped without them —
# see TESTING.md for which those are.
#
# Settings → Secrets and variables → Actions, in your GitHub repo, is where
# these get added once the repo exists.

on:
  push:
    branches: [main]
  pull_request:

env:
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
  TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
  TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
  GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
  GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
  TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}

jobs:
  lint-build-unit:
    name: Lint, build, and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    needs: lint-build-unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
